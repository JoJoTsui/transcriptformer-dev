name: B3 Admission Tests

on:
  push:
    branches: [main]
    paths: &admission-paths
      - "scripts/prepare_b3_paged_native_context.py"
      - "scripts/b3_native_catalog_pages.py"
      - "scripts/bootstrap_b3_streamed.py"
      - "scripts/reduce_b3_streamed_fixed_pairs.py"
      - "scripts/replay_b3_sparse_null.py"
      - "src/transcriptformer/**"
      - "test/test_b3_paged_native_context.py"
      - "test/test_b3_native_catalog_pages.py"
      - ".github/workflows/b3-admission-tests.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths: *admission-paths
  workflow_dispatch:

jobs:
  bounded-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      TF_RUN_REAL_MODEL_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run bounded public admission tests
        run: >-
          python -m pytest
          test/test_b3_paged_native_context.py
          test/test_b3_native_catalog_pages.py
          -q --junitxml=b3-admission-tests.xml
