name: Finetune Tests

on:
  push:
    branches: [main]
    paths: &finetune-paths
      - "src/transcriptformer/finetune/**"
      - "src/transcriptformer/cli/finetune.py"
      - "src/transcriptformer/cli/evaluate.py"
      - "src/transcriptformer/data/**"
      - "src/transcriptformer/model/**"
      - "src/transcriptformer/tokenizer/**"
      - "test/**"
      - "scripts/**"
      - "conf/**"
      - "preprocess/**"
      - ".github/workflows/finetune-tests.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths: *finetune-paths
  workflow_dispatch: # Allow manual triggering

jobs:
  finetune-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e '.[dev]'

      - name: Run finetune pipeline tests
        # Keep the CPU suite explicit: other test modules download real models/data.
        # Add new finetune suites here and to test_finetune_test_selection.py.
        run: |
          python -m pytest \
            test/test_finetune_cli.py \
            test/test_dataprep.py \
            test/test_train.py \
            test/test_gpu.py \
            test/test_early_stopping.py \
            test/test_evaluate.py \
            test/test_small_group_evaluation.py \
            test/test_end_to_end.py \
            test/test_finetune_metadata.py \
            test/test_spatial.py \
            test/test_split_safeguards.py \
            test/test_coordinates.py \
            test/test_holdout_coverage.py \
            test/test_sampling_audit.py \
            test/test_probes.py \
            test/test_checkpoint_compatibility.py \
            test/test_resume_contract.py \
            test/test_worker_epochs.py \
            test/test_missing_stage_evaluation.py \
            test/test_prepared_artifacts.py \
            test/test_preparation_rehearsal.py \
            test/test_finetune_test_selection.py -v
